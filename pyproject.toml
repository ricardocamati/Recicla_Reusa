[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recicla-reusa"
version = "0.1.0"
description = "PoC para doação, descarte e reaproveitamento de eletrônicos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic-settings>=2.6,<3.0",
    "pymongo>=4.10,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mongomock>=4.3,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "selenium>=4.20,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.report]
show_missing = true
skip_covered = false
